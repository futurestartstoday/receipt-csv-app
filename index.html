<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 検索エンジンに載せない -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>レシートCSV</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>レシートCSV</h1>
      <p class="lead">レシート画像から品目・金額・税額を読み取り、CSVで保存します。</p>
      <p class="privacy">🔒 読み取りはすべてお使いのブラウザ内で行います。画像や読み取り結果はサーバーに送信・保存されません。</p>
    </header>

    <section>
      <div id="dropzone" class="dropzone" role="button" tabindex="0">
        <strong>ここにレシート画像をドロップ</strong>
        <span>またはクリックして選択（JPEG・PNG・HEIC・PDF、複数可・スマホはカメラ撮影も可）</span>
      </div>
      <input id="file" type="file" accept="image/*,.heic,.heif,application/pdf,.pdf" multiple hidden>
      <label class="option">
        <input id="accurate" type="checkbox">
        高精度モード（半角カナのレシートなどで品名の読み取り精度が上がります。読み取りに通常の2〜3倍の時間がかかります）
      </label>
      <label class="option">
        <input id="use-ai" type="checkbox">
        生成AIで品目を整理する（精度向上・初回のみ約1GBのモデルをダウンロード）
      </label>
      <p id="ai-note" class="note"></p>
      <p id="status" class="status" aria-live="polite"></p>
      <button id="reread" type="button" hidden>直前の画像を高精度モードで読み直す</button>
    </section>

    <section>
      <div class="toolbar">
        <label>表示: <select id="tax-included">
          <option value="in">税込（内税）</option>
          <option value="out">税抜（外税）</option>
        </select></label>
        <span id="printed-tax" class="note"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>品目</th><th>金額</th><th>税率</th><th>税額</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
          <tfoot>
            <tr><th>合計</th><td id="sum-price" class="num"></td><td></td><td id="sum-tax" class="num"></td><td></td></tr>
          </tfoot>
        </table>
        <p id="empty" class="empty">まだ品目はありません。</p>
      </div>
      <div class="actions">
        <button id="add-row" type="button">行を追加</button>
        <button id="clear" type="button">すべて消去</button>
        <button id="download" type="button" class="primary" disabled>CSVをダウンロード</button>
      </div>
    </section>

    <details>
      <summary>OCRの読み取り結果（確認用）</summary>
      <textarea id="ocr-text" rows="10" readonly></textarea>
    </details>
  </main>
</body>
</html>
